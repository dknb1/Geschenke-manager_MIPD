<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Person anlegen</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Person anlegen</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="alter">Alter:</label>
        <input type="number" id="alter" name="alter" min="0">

        <label for="geschlecht">Geschlecht:</label>
        <select id="geschlecht" name="geschlecht">
            <option value="">Bitte auswählen</option>
            <option value="maennlich">Männlich</option>
            <option value="weiblich">Weiblich</option>
           
        </select>

        <label for="details">Details:</label>
        <textarea id="details" name="details" rows="5"></textarea>

        <button type="submit">Person speichern</button>

    </form>

   

</body>

</html>
